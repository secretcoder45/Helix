<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
    <title>Helix — Unified bioinformatics workspace</title>
    <meta
      name="description"
      content="Look up a gene or protein across UniProt, NCBI Gene, PDB, KEGG and AlphaFold at once, then align, build trees and design primers — with every result traceable to its source release. Free, open source."
    />
    <link rel="canonical" href="https://get-helix.vercel.app/" />

    <!-- Link previews (Slack, email, WhatsApp, X, LinkedIn). Absolute URLs: crawlers don't resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Helix" />
    <meta property="og:url" content="https://get-helix.vercel.app/" />
    <meta property="og:title" content="Helix — One lookup. Every database." />
    <meta
      property="og:description"
      content="UniProt, NCBI Gene, PDB, KEGG and AlphaFold in one lookup — then alignment, phylogeny and primer design, with every result traceable to its source release."
    />
    <meta property="og:image" content="https://get-helix.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Helix: One lookup. Every database. Above a strip of human preproinsulin's 110 residues, coloured by chemistry." />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Inter for interface, Source Serif 4 for display type, JetBrains Mono for
      sequences and identifiers. These are the freely-licensed stand-ins for
      Anthropic's Styrene/Tiempos pairing, which is proprietary to Commercial
      Type and can't be embedded without a license.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Applies the stored theme before first paint, so there's no flash of the
      wrong background. A file rather than an inline script so the Content
      Security Policy can forbid inline scripts entirely (see vercel.json).
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
