# Alembic configuration.
#
# The app applies migrations itself on startup (db.init_db), so in normal use
# nothing here needs running by hand. To create a new migration after
# changing models.py, from this directory:
#
#   alembic revision --autogenerate -m "describe the change"
#
# then read the generated file before committing it — autogenerate misses
# things (renames, data changes) and should never be trusted blind.
#
# The database URL is not set here: migrations/env.py takes it from db.py, so
# there is exactly one place that decides which database is in use.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
