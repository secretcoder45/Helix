# Every push: the offline test suite and a production build of the frontend.
#
# Offline only — these tests depend on nothing outside the repo, so a red
# badge here always means the code is wrong, never that NCBI was slow.
# Checks against the live databases run separately (live-checks.yml).

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biodb-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: biodb-backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Offline test suite
        run: python -m pytest -m "not network" -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biodb-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: biodb-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
