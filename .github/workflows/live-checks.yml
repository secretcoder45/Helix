# Weekly: the tests that query UniProt, NCBI, KEGG and AlphaFold DB live.
#
# These catch the failures the offline suite can't — a source changing its
# API or response format, or a curated entry the tests rely on being revised.
# Kept out of tests.yml so that an upstream outage never marks the code
# itself as broken. Also runnable on demand from the Actions tab.

name: live-checks

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biodb-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: biodb-backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests against live databases
        run: python -m pytest -m network -q
